[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphasignal"
version = "1.0.0"
description = "Real-Time Alpha Hunter for You.com Hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai==0.119.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "aiohttp==3.10.5",
    "tenacity==8.3.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "alpaca-py==0.33.0",
    "pyyaml==6.0.1",
    "streamlit==1.37.1",
    "plotly==5.23.0",
    "fastapi==0.112.0",
    "uvicorn==0.30.1",
    "click==8.1.7",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.3",
    "pytest-mock==3.14.0",
    "ruff==0.6.5",
    "black==24.8.0",
    "mypy==1.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false